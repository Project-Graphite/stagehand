name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build the setup for, such as v0.3.0
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: release
    runs-on: windows-2025
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the version from the tag
        shell: powershell
        run: |
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+)$') { throw "Tag $env:TAG is not a vX.Y.Z version" }
          "VERSION=$($Matches[1])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build
        shell: powershell
        run: |
          ./build.ps1 -Version $env:VERSION
          Copy-Item bin/Stagehand.exe "bin/Stagehand-Setup-$env:VERSION.exe"

      - name: Attest provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: bin/Stagehand-Setup-${{ env.VERSION }}.exe

      - name: Publish release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) { gh release upload $env:TAG "bin/Stagehand-Setup-$env:VERSION.exe" --clobber }
          else { gh release create $env:TAG "bin/Stagehand-Setup-$env:VERSION.exe" --title "Stagehand $env:VERSION" --generate-notes }
